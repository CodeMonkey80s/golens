name: nightly

# The standard library is a broad real-world target: 8,000+ files, every platform suffix,
# cgo, build tags and one intentionally unparseable compiler fixture. It is too slow for a
# PR but catches regressions the unit tests and containerd sample miss.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib:
    name: stdlib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build golens
        run: CGO_ENABLED=0 go build -o golens ./cmd/golens

      # The compiler is the oracle for the check differential: a clean standard library must
      # produce zero diagnostics. This is the broadest real-world clean build available.
      - name: Compile the standard library
        run: go build std

      - name: Check the standard library
        run: ./golens check "$(go env GOROOT)/src"

      # outline is expected to exit 4: the standard library contains one compiler fixture
      # written to be unparseable. What matters is that every other file is still emitted
      # and the partial JSON payload stays valid.
      - name: Outline must be partial but valid
        run: |
          set +e
          ./golens outline "$(go env GOROOT)/src" --json --compact > /tmp/stdlib-outline.json
          code=$?
          set -e
          if [ "$code" -ne 4 ]; then
            echo "outline exit = $code, want 4 (partial output on an unparseable fixture)"
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open('/tmp/stdlib-outline.json', encoding='utf-8') as f:
              files = json.load(f)
          if not isinstance(files, list) or not files:
              raise SystemExit('outline emitted no files')
          print(f'outline files: {len(files)}')
          PY

  fuzz:
    name: fuzz-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzOutline
          - FuzzGet
          - FuzzBounds
          - FuzzCheck
          - FuzzResolve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz for two minutes
        run: go test -run '^$' -fuzz ${{ matrix.target }} -fuzztime 2m -parallel 4 ./internal/usecase

  k9s:
    name: k9s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Build golens
        run: CGO_ENABLED=0 go build -o /tmp/golens ./cmd/golens

      # A second real-world target, pinned like containerd. k9s exercises generics, embedded
      # types, test packages and a large internal package graph that the fixtures do not.
      - name: Fetch k9s
        run: |
          git init -q /tmp/k9s
          git -C /tmp/k9s remote add origin https://github.com/derailed/k9s.git
          git -C /tmp/k9s fetch -q --depth 1 origin ac1bcc620cb153a647160c68bc4886f47dee4391
          git -C /tmp/k9s checkout -q FETCH_HEAD

      - name: Compile k9s
        working-directory: /tmp/k9s
        run: CGO_ENABLED=0 go build ./...

      - name: Check k9s
        run: /tmp/golens check /tmp/k9s
